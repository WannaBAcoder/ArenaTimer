; PlatformIO Project Configuration File
;
; Bare-bones AT-command bridge for validating RA-08H communication on the
; ESP32_Lora timer board. Not part of the real timer firmware - this exists
; purely to type AT commands at the radio over USB serial and see raw
; responses, since it's still unconfirmed whether stock RA-08H firmware
; supports P2P AT+TEST commands or needs a reflash (see project memory:
; RA-08H firmware uncertainty).
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32da]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_port = COM8
monitor_port = COM8

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
