; PlatformIO Project Configuration File
;
; One PCB (PCB Files/TimerRemote), ONE firmware image for every board. Which
; role a board plays (Judge controller vs ready remote, Red vs Blue) is read
; at boot from the RA1/RB1 solder jumpers - see include/roleConfig.h.
;
; https://docs.platformio.org/page/projectconf.html

[env:remote]
platform = ststm32@^19.7.1
board = genericG030K8T
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
; ADC sampling time for external channels: the battery divider is 500k with a
; 100nF reservoir, so give the sample-and-hold plenty of time.
build_flags = -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_160CYCLES_5
