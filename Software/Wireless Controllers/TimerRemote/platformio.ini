; PlatformIO Project Configuration File
;
; One PCB (PCB Files/TimerRemote), two population/firmware variants sharing
; the same source tree:
;   - controller:   5-button "Judge" remote (SW1-SW5, SW7 power switch)
;   - ready_remote: 1-button ready/tapout remote (SW6 only, shares PA6 with
;                   the controller's RESET net - see include/roleConfig.h
;                   for how a given unit's Red/Blue role is set)
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32@^19.7.1
board = genericG030K6T
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
lib_deps =
    ; Pinned below latest: v2.0.0/2.0.0 require STM32duino core >2.12.0
    ; (ArduinoCore-API rewrite), which isn't available in the installed
    ; ststm32 platform yet. RTC is LowPower's own dependency, pinned to
    ; match so the resolver doesn't grab its latest (also incompatible).
    stm32duino/STM32duino Low Power @ ^1.5.0
    stm32duino/STM32duino RTC @ ^1.8.0

[env:controller]
build_flags = -D VARIANT_CONTROLLER

[env:ready_remote]
build_flags = -D VARIANT_READY_REMOTE
