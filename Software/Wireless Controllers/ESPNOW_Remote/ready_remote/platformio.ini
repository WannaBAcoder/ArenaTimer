; PlatformIO Project Configuration File
;
; Red/Blue driver-ready remote - genuine ESP-NOW, recovered from git history
; (see src/main.cpp). Same board as ../controller - see that project's
; platformio.ini for why d1_mini.
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
