; PlatformIO Project Configuration File
;
; Judge remote - genuine ESP-NOW (not LoRa). Board inferred from sibling
; projects in this same remote-hardware family: drive_ready_remote's old
; ESP-NOW build (before it was overwritten with an unrelated LLCC68 design)
; committed FQBN esp8266.esp8266.d1, and LoraReadyButton's own PlatformIO
; project targeted d1_mini - same physical board across this hardware batch.
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
