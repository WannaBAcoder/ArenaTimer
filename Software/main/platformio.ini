; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Mirrors the Arduino IDE FQBN this sketch was previously built with:
; esp32:esp32:esp32da:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=min_spiffs
[env:esp32da]
; pioarduino's espressif32 fork is used instead of the official platformio
; one because it tracks current Arduino-ESP32 core releases; official
; platformio/espressif32 is still pinned to core 2.0.x. This release matches
; the Arduino-ESP32 core (3.3.8) that this sketch was last built against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
; DO NOT force this to real qio (see scripts/force_qio_flash_mode.py.disabled) -
; tried it and it bootlooped this physical board (RTCWDT_RTC_RESET), meaning
; it isn't actually wired for QIO despite the old Arduino FQBN claiming it.
; The platform's forced dio downgrade is what makes this board boot at all.
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

; Comment this out for quieter event-day builds (drops per-button/per-command
; Serial.printf noise). See DEBUG_LOG in include/config.h.
build_flags =
    -D ENABLE_DEBUG_LOG

lib_deps =
    fastled/FastLED @ 3.9.15
    links2004/WebSockets @ 2.6.1
    ayushsharma82/ElegantOTA @ 3.1.7
